<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIO RECORD">
<meta name="theme-color" content="#cfe8cf">
<title>BIO RECORD</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" defer></script>
<style>
  :root{
    --g1:#eaf6ea; --g2:#d3ecd3; --g3:#b9ddb9; --line:#5aa65a; --ink:#1d2a1d; --blue:#1f4fb5;
    --circle:#2f6b2f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#f3faf3;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif}
  header{position:sticky;top:0;z-index:20;background:#f3faf3ee;backdrop-filter:blur(6px);
    padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--g3)}
  header h1{font-size:18px;margin:0 auto 0 0;letter-spacing:.5px}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px;cursor:pointer}
  button.primary{background:var(--line);color:#fff}
  button.danger{border-color:#c44;color:#c44}
  button:active{transform:scale(.97)}
  .hint{font-size:12px;color:#557;padding:6px 12px 0}
  .wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 10px calc(env(safe-area-inset-bottom) + 20px)}
  table{border-collapse:collapse;background:var(--g1);border:2px solid var(--line);min-width:760px;width:100%;
    box-shadow:0 2px 10px #0001;border-radius:4px}
  th,td{border:1px solid var(--g3);text-align:center;padding:6px 6px;white-space:nowrap;font-weight:700;font-size:16px}
  thead th{background:var(--g2);font-size:15px;line-height:1.2;cursor:pointer}
  tbody tr:nth-child(even) td{background:#f4fbf4}
  tbody tr{cursor:pointer}
  tbody tr:active td{background:#d9efd9}
  td.name,th.name{text-align:left;position:sticky;left:0;z-index:2;background:var(--g1)}
  thead th.name{background:var(--g2);z-index:3}
  tbody tr:nth-child(even) td.name{background:#f4fbf4}
  tr.blue td{color:var(--blue)}
  .mk{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:2px solid var(--circle);
    border-radius:50%;font-size:14px;color:var(--circle);background:#fff8}
  tr.blue .mk{border-color:var(--blue);color:var(--blue)}
  .dd{letter-spacing:-2px;font-weight:400}
  /* sheet */
  .back{position:fixed;inset:0;background:#0006;z-index:50;display:none;align-items:flex-end;justify-content:center}
  .back.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
  @media(min-width:700px){.back{align-items:center}.sheet{border-radius:16px}}
  .sheet h2{margin:0 0 12px;font-size:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .full{grid-column:1/-1}
  label{display:flex;flex-direction:column;font-size:12px;color:#456;gap:4px}
  input[type=text],input[type=number],select{font-size:16px;padding:10px;border:1px solid #aac9aa;border-radius:10px;width:100%;background:#fff}
  .traits{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .traits label{align-items:center}
  .traits input{text-align:center;padding:10px 4px}
  .chk{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
  .chk input{width:22px;height:22px}
  .stepper{display:flex;gap:6px;align-items:center}
  .stepper button{padding:8px 14px}
  .stepper span{min-width:60px;text-align:center;font-size:18px}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .row-btns .sp{flex:1}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
    background:#223;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
  .toast.show{opacity:.92}
  .traits select{text-align:center;padding:10px 2px;font-weight:700}
  #imgPrev{width:100%;border:1px solid var(--g3);border-radius:6px;display:block;-webkit-touch-callout:default}
  .imghint{font-size:13px;color:#456;margin:8px 0 0}
  /* 表内プルダウン：セルの見た目は普通の文字のまま、タップで選択 */
  td.sel{position:relative;cursor:pointer}
  td.sel select.cell{position:absolute;inset:0;width:100%;height:100%;opacity:0;-webkit-appearance:none;appearance:none;
    border:0;border-radius:0;padding:0;background:transparent;font-size:16px;cursor:pointer}
  td.sel:focus-within{box-shadow:inset 0 0 0 2px var(--line)}
  @media(hover:hover){td.sel:hover{box-shadow:inset 0 0 0 2px var(--g3)}}
  /* 画像化（html2canvasのクローン）用 */
  .capturing .wrap{overflow:visible}
  .capturing td.name,.capturing th.name{position:static}
  .capturing table{box-shadow:none;border-radius:0}
  .capturing td.sel{box-shadow:none!important}
  .capturing tbody tr:active td{background:inherit}
</style>
</head>
<body>
<header>
  <h1>BIO RECORD</h1>
  <button class="primary" id="addBtn">＋ 追加</button>
  <button id="imgBtn">画像保存</button>
  <button id="menuBtn">メニュー</button>
</header>
<div class="hint">名前・数値をタップで編集／特性・施設・dd5・WAZAはセルをタップして選択。施設「あり」で行が青字になります。変更は自動保存（この端末のブラウザ内）。</div>
<div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>

<!-- 行編集 -->
<div class="back" id="editBack">
  <div class="sheet">
    <h2 id="editTitle">編集</h2>
    <div class="grid">
      <label class="full">名前<input type="text" id="f_name"></label>
      <label>HP<input type="number" inputmode="numeric" id="f_hp"></label>
      <label>攻撃<input type="number" inputmode="numeric" id="f_atk"></label>
      <label>移動<input type="text" id="f_move" placeholder="例 1-6"></label>
      <label>満腹<input type="number" inputmode="numeric" id="f_food"></label>
      <div class="full">
        <div style="font-size:12px;color:#456;margin-bottom:4px">特性</div>
        <div class="traits">
          <label><span id="lt0">飛</span><select id="f_t0"></select></label>
          <label><span id="lt1">跳</span><select id="f_t1"></select></label>
          <label><span id="lt2">夜</span><select id="f_t2"></select></label>
          <label><span id="lt3">泳</span><select id="f_t3"></select></label>
          <label><span id="lt4">歩</span><select id="f_t4"></select></label>
        </div>
      </div>
      <label>施設（ありで青字）<select id="f_fac"><option value="">なし</option><option value="あり">あり</option></select></label>
      <label>dd5（○の数）<select id="f_dd"></select></label>
      <label class="full">WAZA<select id="f_waza"></select></label>
    </div>
    <div class="row-btns">
      <button type="button" id="upBtn">↑ 上へ</button>
      <button type="button" id="downBtn">↓ 下へ</button>
      <button type="button" class="danger" id="delBtn">削除</button>
      <span class="sp"></span>
      <button type="button" id="cancelBtn">閉じる</button>
      <button type="button" class="primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- メニュー -->
<div class="back" id="menuBack">
  <div class="sheet">
    <h2>メニュー</h2>
    <div class="row-btns" style="flex-direction:column">
      <button id="exportHtml">このページを今のデータ入りHTMLで保存</button>
      <button id="exportJson">データをJSONで書き出し</button>
      <button id="importJson">JSONを読み込み</button>
      <button id="copyText">表をテキストでコピー</button>
      <button class="danger" id="resetBtn">初期データに戻す</button>
      <button id="menuClose">閉じる</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  </div>
</div>
<!-- 画像 -->
<div class="back" id="imgBack">
  <div class="sheet">
    <h2>画像として保存</h2>
    <img id="imgPrev" alt="BIO RECORD">
    <p class="imghint">iPhone：「写真に保存」→ 共有メニューの「画像を保存」。うまくいかない時は画像を長押し →「"写真"に保存」。</p>
    <div class="row-btns">
      <button class="primary" id="shareImg">写真に保存</button>
      <button id="dlImg">ダウンロード</button>
      <span class="sp"></span>
      <button id="imgClose">閉じる</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script id="initialData" type="application/json">
{"headers":["BIO RECORD","HP26\n丈夫28","攻撃12\n剛力13","移動7\n健脚8","飛","跳","夜","泳","歩","満腹\n220","施設\n高活23","dd5","WAZA"],
"rows":[
{"name":"オーガ","hp":12,"atk":3,"move":"1236","t":["","","","","歩"],"food":280,"fac":"","dd":3,"waza":"/hammer","blue":false},
{"name":"ブラックドッグ","hp":11,"atk":3,"move":"1-6","t":["","","夜","",""],"food":280,"fac":"","dd":2,"waza":"/thunder","blue":false},
{"name":"ファードット","hp":11,"atk":3,"move":"1-5","t":["","","","","歩"],"food":250,"fac":"あり","dd":2,"waza":"/hammer","blue":true},
{"name":"ヴォルグ","hp":10,"atk":3,"move":"1-5","t":["","敵","夜","",""],"food":280,"fac":"","dd":1,"waza":"/twister","blue":false},
{"name":"ピグミー","hp":11,"atk":2,"move":"1-6","t":["","","","","歩"],"food":250,"fac":"","dd":2,"waza":"/stone","blue":false},
{"name":"ツノリムル","hp":11,"atk":2,"move":"1-6","t":["","","","","歩"],"food":250,"fac":"","dd":2,"waza":"/stone","blue":false},
{"name":"マダラカガ","hp":11,"atk":2,"move":"1-5","t":["","","夜","泳",""],"food":250,"fac":"","dd":1,"waza":"/thunder","blue":false},
{"name":"トビネ","hp":11,"atk":2,"move":"135","t":["","健","","",""],"food":250,"fac":"","dd":2,"waza":"/twister","blue":false},
{"name":"ケマリ","hp":10,"atk":2,"move":"1-6","t":["飛","","","",""],"food":220,"fac":"","dd":1,"waza":"/twister","blue":false},
{"name":"アメノヒグラシ","hp":10,"atk":2,"move":"1-6","t":["","","","泳",""],"food":220,"fac":"","dd":1,"waza":"/thunder","blue":false},
{"name":"ゲッコウヤグラ","hp":10,"atk":2,"move":"1-6","t":["飛","","","泳",""],"food":280,"fac":"","dd":1,"waza":"/thunder","blue":false},
{"name":"ワタメ","hp":10,"atk":2,"move":"1-6","t":["","","","","歩"],"food":250,"fac":"あり","dd":2,"waza":"/stone","blue":true},
{"name":"ネオピグミー","hp":10,"atk":2,"move":"1-5","t":["","","","","歩"],"food":220,"fac":"あり","dd":3,"waza":"/stone","blue":true},
{"name":"コルヌレプス","hp":10,"atk":2,"move":"1-5","t":["","健","","",""],"food":250,"fac":"あり","dd":2,"waza":"/stone","blue":true}
]}
</script>
<script>
const KEY='bio_record_v1';
const INITIAL=JSON.parse(document.getElementById('initialData').textContent);
let data=load();
let editing=-1;
const $=id=>document.getElementById(id);

function load(){
  try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  return JSON.parse(JSON.stringify(INITIAL));
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('この環境では自動保存できません。メニューから保存してください');}
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}

const isBlue=r=>r.fac==='あり';
// 選択肢（表内プルダウンと編集シートで共通）。一覧にない既存値は消さずに選択肢へ追加
const TRAIT_OPTS=[['飛'],['敵','健'],['夜'],['泳'],['歩']];
const WAZA_OPTS=['/hammer','/thunder','/twister','/stone'];
function opts(list,cur,label=v=>v){
  const vals=['',...list];cur=String(cur??'');
  if(!vals.includes(cur))vals.push(cur);
  return vals.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${v===''?'なし':esc(label(v))}</option>`).join('');
}
const traitOptions=(k,cur)=>opts(TRAIT_OPTS[k],cur);
const facOptions=cur=>opts(['あり'],cur==='あり'?'あり':'');
const wazaOptions=cur=>opts(WAZA_OPTS,cur);
function ddOptions(cur){
  const n=+cur||0,vals=[0,1,2,3];if(!vals.includes(n))vals.push(n);
  return vals.map(v=>`<option value="${v}"${v===n?' selected':''}>${'〇'.repeat(v)||'なし'}</option>`).join('');
}
function render(){
  const h=data.headers;
  const lbl=i=>esc(h[i].replace(/\n/g,' '));
  const sel=(f,i,o)=>`<select class="cell" data-f="${f}" data-html2canvas-ignore aria-label="${lbl(i)}">${o}</select>`;
  $('tbl').tHead.innerHTML='<tr>'+h.map((x,i)=>`<th data-h="${i}" class="${i===0?'name':''}">${esc(x).replace(/\n/g,'<br>')}</th>`).join('')+'</tr>';
  $('tbl').tBodies[0].innerHTML=data.rows.map((r,i)=>`<tr data-i="${i}" class="${isBlue(r)?'blue':''}">
    <td class="name">${esc(r.name)}</td><td>${esc(r.hp)}</td><td>${esc(r.atk)}</td><td>${esc(r.move)}</td>
    ${r.t.map((x,k)=>`<td class="sel">${x?`<span class="mk">${esc(x)}</span>`:''}${sel('t'+k,4+k,traitOptions(k,x))}</td>`).join('')}
    <td>${esc(r.food)}</td><td class="sel">${esc(r.fac)}${sel('fac',10,facOptions(r.fac))}</td>
    <td class="sel dd">${'〇'.repeat(r.dd||0)}${sel('dd',11,ddOptions(r.dd))}</td>
    <td class="sel">${esc(r.waza)}${sel('waza',12,wazaOptions(r.waza))}</td></tr>`).join('');
  for(let k=0;k<5;k++) $('lt'+k).textContent=h[4+k];
}

// 表内プルダウンの変更 → 即保存・再描画（施設「あり」で行がすぐ青字）
$('tbl').tBodies[0].addEventListener('change',e=>{
  const s=e.target.closest('select.cell');if(!s)return;
  const r=data.rows[+s.closest('tr').dataset.i],f=s.dataset.f;
  if(f[0]==='t')r.t[+f[1]]=s.value;else if(f==='dd')r.dd=+s.value;else r[f]=s.value;
  r.blue=isBlue(r);save();render();
});

$('tbl').addEventListener('click',e=>{
  if(e.target.closest('select'))return;
  const th=e.target.closest('th');
  if(th){const i=+th.dataset.h;const v=prompt('見出しを変更（改行は「/」で区切り）',data.headers[i].replace(/\n/g,' / '));
    if(v!==null){data.headers[i]=v.split(/\s*\/\s*/).join('\n');save();render();}return;}
  const tr=e.target.closest('tbody tr'); if(tr) openEdit(+tr.dataset.i);
});

function openEdit(i){
  editing=i;
  const r=i>=0?data.rows[i]:{name:'',hp:'',atk:'',move:'',t:['','','','',''],food:'',fac:'',dd:0,waza:''};
  $('editTitle').textContent=i>=0?'編集：'+r.name:'新規追加';
  $('f_name').value=r.name;$('f_hp').value=r.hp;$('f_atk').value=r.atk;$('f_move').value=r.move;
  $('f_food').value=r.food;$('f_fac').value=r.fac==='あり'?'あり':'';
  $('f_waza').innerHTML=wazaOptions(r.waza);$('f_dd').innerHTML=ddOptions(r.dd||0);
  r.t.forEach((x,k)=>{const s=$('f_t'+k);s.innerHTML=traitOptions(k,x);s.value=x;});
  ['upBtn','downBtn','delBtn'].forEach(b=>$(b).style.display=i>=0?'':'none');
  $('editBack').classList.add('show');
}
function closeEdit(){$('editBack').classList.remove('show');}
const num=v=>v===''?'':(isNaN(+v)?v:+v);
$('saveBtn').onclick=()=>{
  const r={name:$('f_name').value.trim(),hp:num($('f_hp').value),atk:num($('f_atk').value),move:$('f_move').value.trim(),
    t:[0,1,2,3,4].map(k=>$('f_t'+k).value),food:num($('f_food').value),fac:$('f_fac').value,
    dd:+$('f_dd').value,waza:$('f_waza').value};
  r.blue=isBlue(r);
  if(!r.name){toast('名前を入力してください');return;}
  if(editing>=0)data.rows[editing]=r;else data.rows.push(r);
  save();render();closeEdit();toast('保存しました');
};
$('cancelBtn').onclick=closeEdit;
$('delBtn').onclick=()=>{if(confirm(data.rows[editing].name+' を削除しますか？')){data.rows.splice(editing,1);save();render();closeEdit();toast('削除しました');}};
function move(d){const j=editing+d;if(j<0||j>=data.rows.length)return;
  [data.rows[editing],data.rows[j]]=[data.rows[j],data.rows[editing]];editing=j;save();render();toast('移動しました');}
$('upBtn').onclick=()=>move(-1);$('downBtn').onclick=()=>move(1);
$('addBtn').onclick=()=>openEdit(-1);
document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)b.classList.remove('show');}));

// メニュー
$('menuBtn').onclick=()=>$('menuBack').classList.add('show');
$('menuClose').onclick=()=>$('menuBack').classList.remove('show');
function download(name,text,type){
  const blob=new Blob([text],{type});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
const stamp=()=>new Date().toISOString().slice(0,10);
$('exportHtml').onclick=()=>{
  const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML
    .replace(/(<script id="initialData" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+'\n'+JSON.stringify(data).replace(/</g,'\\u003c')+'\n'+b)
    .replace(/class="back show"/g,'class="back"').replace(/class="toast show"/,'class="toast"').replace(/ class="capturing"/,'');
  download('bio_record_'+stamp()+'.html',html,'text/html');toast('HTMLを保存しました');
};
$('exportJson').onclick=()=>{download('bio_record_'+stamp()+'.json',JSON.stringify(data,null,1),'application/json');};
$('importJson').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.rows||!d.headers)throw 0;data=d;save();render();toast('読み込みました');$('menuBack').classList.remove('show');}
    catch(_){toast('JSONの形式が違います');}};rd.readAsText(f);e.target.value='';};
$('copyText').onclick=async()=>{
  const lines=[data.headers.map(h=>h.replace(/\n/g,' ')).join('\t')].concat(data.rows.map(r=>
    [r.name,r.hp,r.atk,r.move,...r.t,r.food,r.fac,'〇'.repeat(r.dd||0),r.waza].join('\t')));
  try{await navigator.clipboard.writeText(lines.join('\n'));toast('コピーしました');}catch(_){toast('コピーできませんでした');}
};
$('resetBtn').onclick=()=>{if(confirm('この端末の変更をすべて消して初期データに戻しますか？')){data=JSON.parse(JSON.stringify(INITIAL));save();render();toast('初期データに戻しました');}};
// ===== 画像として保存（html2canvasで表を1枚のPNGに。読み込めない時は簡易Canvas描画） =====
let imgBlob=null, imgFile=null;
const imgName=()=>'bio_record_'+stamp()+'.png';
// dataURL→Blob/File（同期処理にしてiPhoneの共有を確実にする）
function setImage(url){
  const bin=atob(url.split(',')[1]),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  imgBlob=new Blob([a],{type:'image/png'});
  imgFile=new File([imgBlob],imgName(),{type:'image/png'});
  return url;
}
// キャプチャに余白をつけて仕上げ
function finish(canvas,scale){
  const m=14*scale,c=document.createElement('canvas');
  c.width=canvas.width+m*2;c.height=canvas.height+m*2;
  const x=c.getContext('2d');x.fillStyle='#f3faf3';x.fillRect(0,0,c.width,c.height);x.drawImage(canvas,m,m);
  return setImage(c.toDataURL('image/png'));
}
async function captureTable(){
  const tbl=$('tbl'),wrap=tbl.parentElement,sx=scrollX,sy=scrollY,sl=wrap.scrollLeft;
  scrollTo(0,0);wrap.scrollLeft=0;
  const scale=tbl.scrollWidth*tbl.scrollHeight*9>16e6?2:3;
  try{
    const canvas=await html2canvas(tbl,{scale,backgroundColor:'#eaf6ea',logging:false,scrollX:0,scrollY:0,
      windowWidth:Math.max(document.documentElement.clientWidth,tbl.scrollWidth+40),
      windowHeight:Math.max(innerHeight,tbl.scrollHeight+40),
      onclone:doc=>doc.body.classList.add('capturing')});
    window.__exportMethod='html2canvas';
    return finish(canvas,scale);
  }finally{wrap.scrollLeft=sl;scrollTo(sx,sy);}
}
function fallbackImage(){
  window.__exportMethod='manual';toast('簡易描画で画像を作成しました');
  return drawImageManual();
}
function drawImageManual(){
  const S=3, FONT='-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
  const GREEN='#2f6b2f',BLUE='#1f4fb5',INK='#1d2a1d',LINE='#b9ddb9',OUT='#5aa65a';
  const PAD=12,HH=52,RH=42,M=14;
  const cells=data.rows.map(r=>[r.name,r.hp,r.atk,r.move,...r.t,r.food,r.fac,'〇'.repeat(r.dd||0),r.waza].map(v=>String(v??'')));
  const c=document.createElement('canvas'),x=c.getContext('2d');
  const font=s=>`700 ${s}px ${FONT}`;
  // 列幅
  const w=data.headers.map((h,j)=>{
    x.font=font(15);let m=Math.max(...h.split('\n').map(t=>x.measureText(t).width));
    x.font=font(16);cells.forEach(r=>{m=Math.max(m,(j>=4&&j<=8&&r[j])?28:x.measureText(r[j]).width);});
    return Math.ceil(m+PAD*2);
  });
  const W=w.reduce((a,b)=>a+b,0)+M*2, H=HH+RH*cells.length+M*2;
  c.width=W*S;c.height=H*S;x.scale(S,S);
  x.fillStyle='#f3faf3';x.fillRect(0,0,W,H);
  x.fillStyle='#d3ecd3';x.fillRect(M,M,W-M*2,HH);
  cells.forEach((_,i)=>{x.fillStyle=i%2?'#f4fbf4':'#eaf6ea';x.fillRect(M,M+HH+RH*i,W-M*2,RH);});
  x.textBaseline='middle';
  // 見出し
  let cx=M;
  data.headers.forEach((h,j)=>{
    const ls=h.split('\n');x.font=font(15);x.fillStyle=INK;x.textAlign=j===0?'left':'center';
    ls.forEach((t,k)=>x.fillText(t,j===0?cx+PAD:cx+w[j]/2,M+HH/2+(k-(ls.length-1)/2)*18));
    cx+=w[j];
  });
  // 本文
  cells.forEach((r,i)=>{
    const col=isBlue(data.rows[i])?BLUE:INK, cy=M+HH+RH*i+RH/2; cx=M;
    r.forEach((v,j)=>{
      x.fillStyle=col;x.font=font(16);x.textAlign=j===0?'left':'center';
      if(j>=4&&j<=8){ if(v){const mc=isBlue(data.rows[i])?BLUE:GREEN;
          x.beginPath();x.arc(cx+w[j]/2,cy,14,0,Math.PI*2);x.fillStyle='#ffffffaa';x.fill();
          x.lineWidth=2;x.strokeStyle=mc;x.stroke();x.fillStyle=mc;x.font=font(14);x.fillText(v,cx+w[j]/2,cy+1);} }
      else if(j===11){x.font=`400 16px ${FONT}`;x.fillText(v,cx+w[j]/2,cy);}
      else x.fillText(v,j===0?cx+PAD:cx+w[j]/2,cy);
      cx+=w[j];
    });
  });
  // 罫線
  x.strokeStyle=LINE;x.lineWidth=1;x.beginPath();
  cx=M;w.slice(0,-1).forEach(v=>{cx+=v;x.moveTo(cx,M);x.lineTo(cx,H-M);});
  for(let i=0;i<=cells.length;i++){const y=M+HH+RH*i;x.moveTo(M,y);x.lineTo(W-M,y);}
  x.stroke();x.strokeStyle=OUT;x.lineWidth=2;x.strokeRect(M,M,W-M*2,H-M*2);
  return setImage(c.toDataURL('image/png'));
}
$('imgBtn').onclick=async()=>{
  const b=$('imgBtn'),label=b.textContent;b.disabled=true;b.textContent='作成中…';
  try{
    let url;
    try{url=typeof html2canvas==='function'?await captureTable():fallbackImage();}
    catch(e){console.warn(e);url=fallbackImage();}
    $('imgPrev').src=url;$('imgBack').classList.add('show');
  }finally{b.disabled=false;b.textContent=label;}
};
$('imgClose').onclick=()=>$('imgBack').classList.remove('show');
$('dlImg').onclick=()=>{
  if(!imgBlob)return;
  const href=URL.createObjectURL(imgBlob);
  if('download' in HTMLAnchorElement.prototype){
    const a=document.createElement('a');a.href=href;a.download=imgName();document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(href);a.remove();},1000);
  }else if(!window.open(href,'_blank')){toast('画像を長押しして「写真に保存」してください');}
};
// 共有はタップ内で同期的に呼ぶ（awaitを挟むとiPhoneで共有が拒否される）
$('shareImg').onclick=()=>{
  if(imgFile&&navigator.canShare&&navigator.canShare({files:[imgFile]})){
    navigator.share({files:[imgFile]}).catch(e=>{if(e.name!=='AbortError'){$('dlImg').click();toast('共有できなかったのでダウンロードします。保存できない場合は画像を長押ししてください');}});
  }else{$('dlImg').click();}
};
render();
</script>
